[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rtmpl"
version = "0.2.0"
description = "Research-project template sync CLI (rtmpl)."
requires-python = ">=3.11"
dependencies = ["pyyaml"]

[project.scripts]
rtmpl = "rtmpl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["rtmpl"]
# rtmpl/templates/ ships as package data automatically (hatchling includes all
# files under the declared package). `importlib.resources.files("rtmpl")/"templates"`
# resolves to it both in dev (local tree) and when installed from the wheel.

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]
