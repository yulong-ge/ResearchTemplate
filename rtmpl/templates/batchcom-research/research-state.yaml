schema_version: 1
updated_at: YYYY-MM-DD

# This is the compact index of the project. Full prose belongs in the linked
# record, so an agent can restore context without reading the whole repository.
research_question: "<one-line research question>"
status: candidate # candidate | active | waiting | closed
active_direction: null # D<id>
active_hypothesis: null # H<id>

# Project-level override of research/policy.yaml automation_mode. Keep
# inherit_policy to follow policy; a direction decision may set a finite override.
automation_mode: inherit_policy # manual | semi-auto | full-auto | inherit_policy

next_action:
  owner: agent # agent | human
  text: "<one concrete next action>"
  done_when: "<observable stopping condition>"

waiting:
  reason: null
  on: null
  unblock_action: null

objects:
  hypotheses: [] # H ids
  experiments: [] # semantic labels like batch-size-01
  results: [] # R ids
  findings: [] # F ids
  claims: [] # C ids
  decisions: [] # D ids

relations: []
# Example:
# - from: H1
#   to: batch-size-01
#   type: tested_by # tested_by | produced | supports | challenges | authorizes | follows
