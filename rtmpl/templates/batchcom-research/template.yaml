name: batchcom-research
display: "BatchCom 深度学习研究模板"
version: "0.2.1"
variables:
  - token: "<proj>"
    field: proj
    render_files: ["pyproject.toml", "src/paths.py"]
    prompt: "项目 slug（如 my-research）"
    required: true
    validation: '^[a-z0-9][a-z0-9-]*$'
  - token: "<conda-env>"
    field: conda_env
    render_files: ["src/paths.py"]
    prompt: "服务器 conda 环境名（如 ml）"
    required: true
    validation: '^[A-Za-z0-9_.-]+$'
  - token: "<zotero-api-key>"
    field: zotero_api_key
    render_files: [".opencode/opencode.json"]
    prompt: "Zotero API key（不用 Zotero 可留空）"
    required: false
    validation: '^[A-Za-z0-9]*$'
  - token: "<zotero-library-id>"
    field: zotero_library_id
    render_files: [".opencode/opencode.json"]
    prompt: "Zotero library ID（用户库数字 ID，可留空）"
    required: false
    validation: '^[0-9]*$'
exclude: []
